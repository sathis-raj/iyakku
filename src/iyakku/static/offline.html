<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#a0e650">
    <title>Iyakku - Offline</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f1a0f;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            -webkit-user-select: none;
            user-select: none;
        }
        .offline-card {
            text-align: center;
            max-width: 340px;
        }
        .offline-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.9;
        }
        .offline-title {
            font-size: 22px;
            font-weight: 700;
            color: #a0e650;
            margin-bottom: 12px;
        }
        .offline-msg {
            font-size: 15px;
            color: #aaa;
            line-height: 1.5;
            margin-bottom: 28px;
        }
        .offline-steps {
            text-align: left;
            font-size: 14px;
            color: #999;
            line-height: 1.8;
            margin-bottom: 28px;
            padding-left: 8px;
        }
        .offline-steps li {
            margin-bottom: 4px;
        }
        .retry-btn {
            display: inline-block;
            background: #a0e650;
            color: #0f1a0f;
            border: none;
            border-radius: 12px;
            padding: 14px 36px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .retry-btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-icon">&#128268;</div>
        <div class="offline-title">Can't reach Iyakku</div>
        <div class="offline-msg">The controller can't connect to the server on your laptop.</div>
        <ol class="offline-steps">
            <li>Make sure Iyakku is running on your laptop</li>
            <li>Connect your phone to the same WiFi network</li>
            <li>Tap <strong>Retry</strong> to try again</li>
        </ol>
        <button class="retry-btn" onclick="location.reload()">Retry</button>
    </div>
</body>
</html>
